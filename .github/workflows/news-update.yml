name: Update NewsTeen75 Feed

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newsteen75-news-update
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Fetch latest news
        run: npm run fetch-news

      - name: Commit feed only when news changed
        shell: bash
        run: |
          git add data/news.json
          if git diff --cached --quiet; then
            echo "No new news to commit."
            exit 0
          fi

          git config user.name "NewsTeen75 Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Update NewsTeen75 feed"
          git pull --rebase origin main
          git push origin HEAD:main

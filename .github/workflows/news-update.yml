name: Update NewsTeen75 Feed

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newsteen75-news-update
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Fetch latest news
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FEED_MAX_ARTICLES: ${{ vars.FEED_MAX_ARTICLES || '250' }}
          MAX_NEW_EXTERNAL_PER_CATEGORY: ${{ vars.MAX_NEW_EXTERNAL_PER_CATEGORY || '10' }}
          MAX_NEW_BIHAR_PER_CATEGORY: ${{ vars.MAX_NEW_BIHAR_PER_CATEGORY || '4' }}
          RSS_ITEMS_PER_CATEGORY: ${{ vars.RSS_ITEMS_PER_CATEGORY || '60' }}
          FRESH_WINDOW_HOURS: ${{ vars.FRESH_WINDOW_HOURS || '48' }}
          FEED_RETENTION_HOURS: ${{ vars.FEED_RETENTION_HOURS || '168' }}
        run: npm run fetch-news

      - name: Commit feed only when news changed
        shell: bash
        run: |
          git add data/news.json
          if git diff --cached --quiet; then
            echo "No new news to commit."
            exit 0
          fi

          git config user.name "NewsTeen75 Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Update NewsTeen75 feed"
          git pull --rebase origin main
          git push origin HEAD:main

name: Send NewsTeen75 Trending Notifications

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send a Firebase test notification"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: newsteen75-trending-notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Send trending notification
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
          FCM_TEST_TOKEN: ${{ secrets.FCM_TEST_TOKEN }}
          FCM_TOPIC: ${{ vars.FCM_TOPIC || 'trending-news' }}
          NOTIFICATION_MAX_AGE_HOURS: ${{ vars.NOTIFICATION_MAX_AGE_HOURS || '12' }}
          NOTIFICATION_HISTORY_LIMIT: ${{ vars.NOTIFICATION_HISTORY_LIMIT || '100' }}
          SEND_TEST_NOTIFICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test && 'true' || 'false' }}
        run: npm run send-trending-notification

      - name: Commit notification state and history when changed
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.send_test) }}
        shell: bash
        run: |
          git add data/notification-state.json data/notifications.json
          if git diff --cached --quiet; then
            echo "No notification state/history change to commit."
            exit 0
          fi

          git config user.name "NewsTeen75 Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Update trending notification state"
          git pull --rebase origin main
          git push origin HEAD:main
